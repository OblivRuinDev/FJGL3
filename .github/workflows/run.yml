name: FJGL Run

on:
  workflow_call:
    inputs:
      buildType:
        description: 'Build type: build or ci'
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  ANT_OPTS: -Xmx2G
  LWJGL_BUILD_TYPE: nightly
  RUNTIME_EXPORTS: --add-exports=java.base/jdk.internal.access=ALL-UNNAMED --add-exports=java.base/jdk.internal.foreign=ALL-UNNAMED --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-exports=java.base/jdk.internal.util=ALL-UNNAMED
  COMPILE_EXPORTS: --add-exports=java.base/jdk.internal.access=ALL-UNNAMED --add-exports=java.base/jdk.internal.foreign=ALL-UNNAMED --add-exports=java.base/jdk.internal.misc=ALL-UNNAMED --add-exports=java.base/jdk.internal.util=ALL-UNNAMED --add-exports=java.base/jdk.internal.vm.annotation=ALL-UNNAMED

jobs:
  prepare:
    name: Prepare generator cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          check-latest: true

      - name: Restore cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/classes/generator
            bin/classes/templates
            bin/libs
          key: fjgl-kotlinc-${{ github.sha }}
          enableCrossOsArchive: true

      - name: Compile templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/LWJGL-CI/OculusSDK.git ../OculusSDK
          ant -emacs compile-templates

      - name: Save generator cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/classes/generator
            bin/classes/templates
            bin/libs
          key: fjgl-kotlinc-${{ github.sha }}

  linux:
    name: Linux
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    strategy:
      fail-fast: false
      matrix:
        ARCH: [x64]
        include:
          - ARCH: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: dnf -y install git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          check-latest: true

      - name: Install build dependencies
        run: |
          dnf -y install epel-release wget
          dnf config-manager --set-enabled powertools
          dnf -y update
          dnf -y install gcc-toolset-15-gcc gcc-toolset-15-gcc-c++ ant curl zstd make

      - name: Install FJGL dependencies
        run: |
          dnf -y install \
            libX11-devel \
            libXt-devel \
            gtk3-devel \
            dbus-devel

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/classes/generator
            bin/classes/templates
            bin/libs
          key: fjgl-kotlinc-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Generate bindings
        run: ant -emacs clean-generated generate
      - name: Build Java
        run: ant -emacs compile
      - name: Restore native cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/libs/native/linux/x64
          key: fjgl-native-${{ github.sha }}-linux-x64
      - name: Build native
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          source /opt/rh/gcc-toolset-15/enable || true
          ant -emacs compile-native -Dgcc.version.print=true
      - name: Save native cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/libs/native/linux/x64
          key: fjgl-native-${{ github.sha }}-linux-x64
      - name: Run tests
        run: |
          source /opt/rh/gcc-toolset-15/enable || true
          ant -emacs tests -Djvmargs="${{ env.RUNTIME_EXPORTS }}"

      - name: Print test results
        run: cat bin/test/testng-results.xml 2>/dev/null || true
        if: failure()

      - name: Run demo with OpenJDK
        if: ${{ inputs.buildType == 'build' }}
        run: ant demo -Dclass=org.lwjgl.demo.util.lz4.HelloLZ4 -Djvmargs="${{ env.RUNTIME_EXPORTS }}"
      - name: Build GraalVM Native Image
        if: ${{ inputs.buildType == 'build' }}
        run: |
          source /opt/rh/gcc-toolset-15/enable || true
          mkdir jdk-graalvm
          curl -L https://download.oracle.com/graalvm/25/latest/graalvm-jdk-25_linux-x64_bin.tar.gz | tar xz -C jdk-graalvm --strip-components 1
          jdk-graalvm/bin/native-image -cp \
          bin/classes/lwjgl/core:\
          bin/classes/lwjgl/lz4:\
          bin/classes/samples:\
          modules/samples/src/test/resources:\
          bin/libs/java/joml.jar:\
          bin/libs/native:\
          config/native-image \
          org.lwjgl.demo.util.lz4.HelloLZ4 --verbose --no-fallback \
          --enable-native-access=ALL-UNNAMED \
          ${{ env.COMPILE_EXPORTS }}
      - name: Run demo with GraalVM JIT
        if: ${{ inputs.buildType == 'build' }}
        run: JAVA_HOME=jdk-graalvm ant demo -Dclass=org.lwjgl.demo.util.lz4.HelloLZ4 -Djvmargs="${{ env.RUNTIME_EXPORTS }}"
      - name: Run demo with GraalVM Native Image
        if: ${{ inputs.buildType == 'build' }}
        run: ./org.lwjgl.demo.util.lz4.hellolz4

  linux-cross:
    name: Linux Cross
    needs: prepare
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        ARCH: [arm32, arm64, ppc64le, riscv64]
        include:
          - ARCH: arm32
            RUNNER: ubuntu-22.04
            CROSS_ARCH: armhf
            TRIPLET: arm-linux-gnueabihf
            GCC: 12
          - ARCH: arm64
            RUNNER: ubuntu-22.04
            CROSS_ARCH: arm64
            TRIPLET: aarch64-linux-gnu
            GCC: 12
          - ARCH: ppc64le
            RUNNER: ubuntu-22.04
            CROSS_ARCH: ppc64el
            TRIPLET: powerpc64le-linux-gnu
            GCC: 12
          - ARCH: riscv64
            RUNNER: ubuntu-24.04
            CROSS_ARCH: riscv64
            TRIPLET: riscv64-linux-gnu
            GCC: 14
    env:
      LWJGL_BUILD_ARCH: ${{ matrix.ARCH }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          check-latest: true

      - name: Install dependencies (Build)
        if: ${{ inputs.buildType == 'build' }}
        run: |
          git config --global --add safe.directory $(pwd)
          sudo apt-mark hold python3
          sudo apt-get -yq update
          sudo apt-get -yq install ant curl zstd make \
            gcc-${{matrix.GCC}}-${{matrix.TRIPLET}} \
            g++-${{matrix.GCC}}-${{matrix.TRIPLET}} \
            libc6-dev-${{matrix.CROSS_ARCH}}-cross

      - name: Install dependencies (CI)
        if: ${{ inputs.buildType == 'ci' }}
        run: |
          git config --global --add safe.directory $(pwd)
          sudo apt-mark hold python3
          sudo apt-get -yq update
          sudo apt-get -yq install ant curl \
            gcc-${{matrix.GCC}}-${{matrix.TRIPLET}} \
            g++-${{matrix.GCC}}-${{matrix.TRIPLET}} \
            libc6-dev-${{matrix.CROSS_ARCH}}-cross

      - name: Prepare cross-compilation for ${{matrix.CROSS_ARCH}}
        if: matrix.RUNNER == 'ubuntu-22.04'
        run: |
          sudo grep 'deb ' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/ports.list
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo sed -i 's#^deb [^ ]\+#deb [arch=${{matrix.CROSS_ARCH}}] https://ports.ubuntu.com/ubuntu-ports/#' /etc/apt/sources.list.d/ports.list
          sudo dpkg --add-architecture ${{matrix.CROSS_ARCH}}
          sudo apt-get update
      - name: Prepare cross-compilation for ${{matrix.CROSS_ARCH}}
        if: matrix.RUNNER == 'ubuntu-24.04'
        run: |
          native="$(dpkg --print-architecture)"
          . /etc/os-release
          suite="${VERSION_CODENAME}"
          keyring="/usr/share/keyrings/ubuntu-archive-keyring.gpg"
          components="main restricted universe multiverse"

          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: ${suite} ${suite}-updates ${suite}-backports
          Components: ${components}
          Architectures: ${native}
          Signed-By: ${keyring}

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: ${suite}-security
          Components: ${components}
          Architectures: ${native}
          Signed-By: ${keyring}
          EOF

          sudo tee /etc/apt/sources.list.d/ci-ubuntu-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: https://ports.ubuntu.com/ubuntu-ports/
          Suites: ${suite} ${suite}-updates ${suite}-backports ${suite}-security
          Components: ${components}
          Architectures: ${{ matrix.CROSS_ARCH }}
          Signed-By: ${keyring}
          EOF

          sudo dpkg --add-architecture ${{ matrix.CROSS_ARCH }}
          sudo apt-get update
      - name: Install cross-compilation dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get -yq install \
            libgtk-3-dev:${{ matrix.CROSS_ARCH }} \
            libatk-bridge2.0-dev:${{ matrix.CROSS_ARCH }} \
            libgdk-pixbuf2.0-dev:${{ matrix.CROSS_ARCH }} \
            libglu-dev:${{ matrix.CROSS_ARCH }} \
            libgl1:${{ matrix.CROSS_ARCH }} \
            libglx-mesa0:${{ matrix.CROSS_ARCH }} \
            libx11-dev:${{ matrix.CROSS_ARCH }} \
            libxt-dev:${{ matrix.CROSS_ARCH }} \
            libdbus-1-dev:${{ matrix.CROSS_ARCH }}

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/classes/generator
            bin/classes/templates
            bin/libs
          key: fjgl-kotlinc-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Generate bindings
        run: ant -emacs clean-generated generate
      - name: Build Java
        run: ant -emacs compile
      - name: Restore native cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/libs/native/linux/${{ matrix.ARCH }}
          key: fjgl-native-${{ github.sha }}-linux-${{ matrix.ARCH }}
      - name: Build native
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ant -emacs compile-native -Dgcc.version=${{ matrix.GCC }} -Dgcc.version.print=true -Dgcc.libpath.opengl=/usr/lib/${{ matrix.TRIPLET }}/mesa
      - name: Save native cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/libs/native/linux/${{ matrix.ARCH }}
          key: fjgl-native-${{ github.sha }}-linux-${{ matrix.ARCH }}

  freebsd-cross:
    name: FreeBSD Cross
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          check-latest: true

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/classes/generator
            bin/classes/templates
            bin/libs
          key: fjgl-kotlinc-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Generate bindings
        run: ant -emacs clean-generated generate
      - name: Build Java
        run: ant -emacs compile

      - name: Start VM
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963 # v1.4.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '14.4'
          memory: 8G
          environment_variables: ANT_OPTS LWJGL_BUILD_TYPE

      - name: Install build dependencies (Build)
        if: ${{ inputs.buildType == 'build' }}
        shell: cpa.sh {0} # zizmor: ignore[misfeature] cpa.sh runs the step inside the FreeBSD VM
        run: sudo pkg install -y openjdk8 apache-ant git

      - name: Install FJGL dependencies
        shell: cpa.sh {0} # zizmor: ignore[misfeature] cpa.sh runs the step inside the FreeBSD VM
        run: sudo pkg install -y gtk3 dbus
      - name: Restore native cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/libs/native/freebsd/x64
          key: fjgl-native-${{ github.sha }}-freebsd-x64
      - name: Build native
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: cpa.sh {0} # zizmor: ignore[misfeature] cpa.sh runs the step inside the FreeBSD VM
        run: ant -emacs compile-native -Dclang.version.print=true
      - name: Save native cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/libs/native/freebsd/x64
          key: fjgl-native-${{ github.sha }}-freebsd-x64
      - name: Run tests
        shell: cpa.sh {0} # zizmor: ignore[misfeature] cpa.sh runs the step inside the FreeBSD VM
        run: ant -emacs tests -Djvmargs="${{ env.RUNTIME_EXPORTS }}"
      - name: Print test results
        run: cat bin/test/testng-results.xml 2>/dev/null || true
        if: failure()
      - name: Run demo with OpenJDK
        if: ${{ inputs.buildType == 'build' }}
        shell: cpa.sh {0} # zizmor: ignore[misfeature] cpa.sh runs the step inside the FreeBSD VM
        run: ant demo -Dclass=org.lwjgl.demo.util.lz4.HelloLZ4 -Djvmargs="${{ env.RUNTIME_EXPORTS }}"

  macos:
    name: macOS
    needs: prepare
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        ARCH: [x64, arm64]
        include:
          - ARCH: x64
            RUNNER: macos-26-intel
            JDK: x64
            JAVA_HOME_ARCH: X64
          - ARCH: arm64
            RUNNER: macos-26
            JDK: aarch64
            JAVA_HOME_ARCH: ARM64
    env:
      LWJGL_BUILD_ARCH: ${{ matrix.ARCH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          check-latest: true

      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/classes/generator
            bin/classes/templates
            bin/libs
          key: fjgl-kotlinc-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Generate bindings
        run: ant -emacs clean-generated generate
      - name: Build Java
        run: ant -emacs compile
      - name: Restore native cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/libs/native/macos/${{ matrix.ARCH }}
          key: fjgl-native-${{ github.sha }}-macos-${{ matrix.ARCH }}
          enableCrossOsArchive: true
      - name: Build native
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ant -emacs compile-native -Dclang.version.print=true
      - name: Save native cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/libs/native/macos/${{ matrix.ARCH }}
          key: fjgl-native-${{ github.sha }}-macos-${{ matrix.ARCH }}
          enableCrossOsArchive: true
      - name: Run tests
        run: ant -emacs tests -Djvmargs="${{ env.RUNTIME_EXPORTS }}"
      - name: Print test results
        run: cat bin/test/testng-results.xml 2>/dev/null || true
        if: failure()

      - name: Run demo with OpenJDK
        if: ${{ inputs.buildType == 'build' }}
        run: ant demo -Dclass=org.lwjgl.demo.util.lz4.HelloLZ4 -Djvmargs="${{ env.RUNTIME_EXPORTS }}"
      - name: Build GraalVM Native Image
        if: ${{ inputs.buildType == 'build' }}
        run: |
          mkdir jdk-graalvm
          curl -L https://download.oracle.com/graalvm/25/latest/graalvm-jdk-25_macos-${{matrix.JDK}}_bin.tar.gz | tar xz -C jdk-graalvm --strip-components 2
          jdk-graalvm/Home/bin/native-image -cp \
          bin/classes/lwjgl/core:\
          bin/classes/lwjgl/lz4:\
          bin/classes/samples:\
          modules/samples/src/test/resources:\
          bin/libs/java/joml.jar:\
          bin/libs/native:\
          config/native-image \
          org.lwjgl.demo.util.lz4.HelloLZ4 --verbose --no-fallback \
          --enable-native-access=ALL-UNNAMED \
          ${{ env.COMPILE_EXPORTS }}
      - name: Run demo with GraalVM JIT
        if: ${{ inputs.buildType == 'build' }}
        run: JAVA_HOME=jdk-graalvm/Home ant demo -Dclass=org.lwjgl.demo.util.lz4.HelloLZ4 -Djvmargs="${{ env.RUNTIME_EXPORTS }}"
      - name: Run demo with GraalVM Native Image
        if: ${{ inputs.buildType == 'build' }}
        run: ./org.lwjgl.demo.util.lz4.hellolz4

  windows:
    name: Windows
    needs: prepare
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        ARCH: [x64, arm64]
        include:
          - ARCH: x64
            MSVC_ARCH: amd64
          - ARCH: arm64
            MSVC_ARCH: amd64_arm64
    env:
      ANT_OPTS: -Xmx1G
      LWJGL_BUILD_ARCH: ${{matrix.ARCH}}
    defaults:
      run:
        shell: cmd # zizmor: ignore[misfeature] Windows build/test steps are written in CMD syntax; pwsh/bash would break them.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.MSVC_ARCH }}

      - name: Clone Oculus SDK
        run: git clone https://github.com/LWJGL-CI/OculusSDK.git ../OculusSDK
        if: contains(matrix.ARCH, 'arm') != true

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '25'
          check-latest: true
#      - name: Install Visual Studio 2026 Build Tools
