# Builds FJGL and runs tests.
# No artifacts are uploaded, see LWJGL-CI/lwjgl3 for that.
name: FJGL Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  ANT_OPTS: -Xmx1G
  LWJGL_BUILD_TYPE: nightly

jobs:
  run:
    name: Build
    uses: ./.github/workflows/run.yml
    with:
      buildType: build